<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webtoon Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #111;
      --surface: #1a1a1a;
      --surface2: #222;
      --border: #2e2e2e;
      --accent: #e8b86d;
      --text: #f0f0f0;
      --text-muted: #888;
      --text-dim: #444;
      --nav-h: 52px;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      min-height: 100vh;
    }

    /* ── Top nav ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      height: var(--nav-h);
      background: rgba(17,17,17,0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }

    .nav-back {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
      padding: 4px 8px 4px 0;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    .nav-back:hover { color: var(--text); }

    .nav-info { flex: 1; min-width: 0; }
    .nav-series {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nav-ep {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-count {
      font-size: 12px;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    /* ── Viewer ── */
    #viewer {
      padding-top: var(--nav-h);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .panels {
      width: 100%;
      max-width: 720px;
      padding-top: 20px;
    }

    /* ── Panel ── */
    .panel-wrap {
      position: relative;
      width: 100%;
      background: var(--surface);
      margin-bottom: 2px;
      min-height: 200px;
    }

    .panel-wrap img {
      display: block;
      width: 100%;
      height: auto;
      opacity: 0;
      transition: opacity 0.25s;
    }
    .panel-wrap img.loaded { opacity: 1; }

    .panel-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .placeholder-dots { display: flex; gap: 6px; }
    .placeholder-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--border);
      animation: pulse 1.4s ease-in-out infinite;
    }
    .placeholder-dot:nth-child(2) { animation-delay: 0.2s; }
    .placeholder-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
      40%            { opacity: 1;    transform: scale(1); }
    }

    .panel-error {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 6px;
      color: var(--text-dim);
      font-size: 12px;
    }
    .panel-error.show { display: flex; }
    .panel-error .fname { font-size: 10px; opacity: 0.5; }

    /* ── Episode nav ── */
    .ep-nav {
      width: 100%;
      max-width: 720px;
      padding: 28px 16px 64px;
      display: flex;
      gap: 10px;
    }
    .ep-nav-btn {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      cursor: pointer;
      color: var(--text);
      text-align: left;
      transition: border-color 0.2s, background 0.2s;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .ep-nav-btn:hover { border-color: var(--accent); background: var(--surface2); }
    .ep-nav-btn:disabled { opacity: 0.25; cursor: not-allowed; pointer-events: none; }
    .ep-nav-btn.right { text-align: right; }
    .ep-nav-label { font-size: 11px; color: var(--text-muted); }
    .ep-nav-title { font-size: 13px; font-weight: 600; }

    /* ── Scroll top ── */
    #scroll-top {
      position: fixed;
      bottom: 22px; right: 18px;
      z-index: 100;
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, color 0.2s;
    }
    #scroll-top.show { display: flex; }
    #scroll-top:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Loading / Error screens ── */
    #loading-screen {
      position: fixed; inset: 0;
      background: var(--bg);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      color: var(--text-muted);
      font-size: 13px;
      transition: opacity 0.3s;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 26px; height: 26px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #error-screen {
      display: none; position: fixed; inset: 0;
      background: var(--bg); z-index: 999;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 14px;
      text-align: center; padding: 40px;
    }
    #error-screen.show { display: flex; }
    #error-screen p { color: var(--text-muted); font-size: 14px; }
    #error-screen a { color: var(--accent); text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <span>불러오는 중...</span>
  </div>

  <div id="error-screen">
    <h2>에피소드를 찾을 수 없습니다</h2>
    <p>요청하신 에피소드가 존재하지 않거나<br>아직 이미지가 생성되지 않았습니다.</p>
    <a href="index.html">← 목록으로 돌아가기</a>
  </div>

  <nav id="top-nav" style="display:none">
    <button class="nav-back" onclick="history.length > 1 ? history.back() : location.href='index.html'">←</button>
    <div class="nav-info">
      <div class="nav-series" id="nav-series"></div>
      <div class="nav-ep" id="nav-ep"></div>
    </div>
    <div class="nav-count" id="nav-count"></div>
  </nav>

  <div id="viewer">
    <div class="panels" id="panels"></div>
    <div class="ep-nav" id="ep-nav"></div>
  </div>

  <button id="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

  <script>
    const params   = new URLSearchParams(location.search);
    const seriesId = params.get('series');
    const epId     = params.get('ep');

    let series  = null;
    let episode = null;
    let epIndex = -1;

    // Lazy-load observer
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const wrap = entry.target;
        const img  = wrap.querySelector('img[data-src]');
        if (img) {
          img.src = img.dataset.src;
          img.removeAttribute('data-src');
        }
        observer.unobserve(wrap);
      });
    }, { rootMargin: '400px' });

    function renderPanels() {
      const container = document.getElementById('panels');
      container.innerHTML = episode.images.map((src, i) => {
        const fname = src.split('/').pop();
        return `
          <div class="panel-wrap" id="pw${i}">
            <div class="panel-placeholder" id="ph${i}">
              <div class="placeholder-dots">
                <div class="placeholder-dot"></div>
                <div class="placeholder-dot"></div>
                <div class="placeholder-dot"></div>
              </div>
            </div>
            <div class="panel-error" id="pe${i}">
              <span>이미지 없음</span>
              <span class="fname">${fname}</span>
            </div>
            <img data-src="${src}" alt="컷 ${i+1}"
              onload="imgLoad(${i})" onerror="imgError(${i})" />
          </div>`;
      }).join('');

      container.querySelectorAll('.panel-wrap').forEach(el => observer.observe(el));
    }

    function imgLoad(i) {
      document.querySelector(`#pw${i} img`).classList.add('loaded');
      document.getElementById(`ph${i}`).style.display = 'none';
    }

    function imgError(i) {
      document.querySelector(`#pw${i} img`).style.display = 'none';
      document.getElementById(`ph${i}`).style.display = 'none';
      document.getElementById(`pe${i}`).classList.add('show');
    }

    function renderEpNav() {
      const prev = epIndex > 0 ? series.episodes[epIndex - 1] : null;
      const next = epIndex < series.episodes.length - 1 ? series.episodes[epIndex + 1] : null;
      const url  = (ep) => `viewer.html?series=${series.id}&ep=${ep.id}`;

      document.getElementById('ep-nav').innerHTML = `
        <button class="ep-nav-btn" ${!prev ? 'disabled' : `onclick="location.href='${url(prev)}'"`}>
          <span class="ep-nav-label">← 이전화</span>
          <span class="ep-nav-title">${prev ? `EP ${prev.number}  ${prev.title}` : '첫 번째 화'}</span>
        </button>
        <button class="ep-nav-btn right" ${!next ? 'disabled' : `onclick="location.href='${url(next)}'"`}>
          <span class="ep-nav-label">다음화 →</span>
          <span class="ep-nav-title">${next ? `EP ${next.number}  ${next.title}` : '마지막 화'}</span>
        </button>`;
    }

    function init() {
      series = CATALOG.series.find(s => s.id === seriesId);
      if (!series) { showError(); return; }

      epIndex = series.episodes.findIndex(e => e.id === epId);
      if (epIndex === -1) { showError(); return; }

      episode = series.episodes[epIndex];

      document.title = `${episode.title} — ${series.title}`;
      document.getElementById('nav-series').textContent = series.title;
      document.getElementById('nav-ep').textContent = `EP ${episode.number}  ${episode.title}`;
      document.getElementById('nav-count').textContent = `${episode.cutCount}컷`;
      document.getElementById('top-nav').style.display = 'flex';

      renderPanels();
      renderEpNav();
      hideLoading();
    }

    function hideLoading() {
      const el = document.getElementById('loading-screen');
      el.classList.add('hidden');
      setTimeout(() => el.style.display = 'none', 300);
    }

    function showError() {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('error-screen').classList.add('show');
    }

    window.addEventListener('scroll', () => {
      document.getElementById('scroll-top').classList.toggle('show', window.scrollY > 500);
    }, { passive: true });

    init();
  </script>
