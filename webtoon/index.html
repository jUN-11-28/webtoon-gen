<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webtoon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #242424;
      --border: #2e2e2e;
      --accent: #e8b86d;
      --accent-dim: rgba(232, 184, 109, 0.12);
      --text: #f0f0f0;
      --text-muted: #888;
      --text-dim: #555;
      --radius: 12px;
      --radius-sm: 8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--accent);
    }
    .logo span { color: var(--text); font-weight: 400; }

    /* ── Main layout ── */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* ── Breadcrumb ── */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 32px;
      min-height: 20px;
    }
    .breadcrumb button {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 13px;
      padding: 0;
    }
    .breadcrumb button:hover { text-decoration: underline; }
    .breadcrumb .sep { color: var(--text-dim); }

    /* ── Section title ── */
    .section-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: -0.3px;
    }
    .section-title small {
      display: block;
      font-size: 13px;
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ── Series grid ── */
    #series-view { display: block; }
    #episode-view { display: none; }

    .series-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .series-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }
    .series-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent-dim);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .series-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .series-card:hover::before { opacity: 1; }

    .series-card .en-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .series-card .kr-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .series-card .desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .series-card .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .genre-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .genre-tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .ep-count {
      font-size: 12px;
      color: var(--text-dim);
    }

    /* ── Episode list ── */
    .series-header {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 32px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }
    .series-header .info { flex: 1; }
    .series-header .en { font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
    .series-header .title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 10px; }
    .series-header .desc { font-size: 14px; color: var(--text-muted); line-height: 1.7; }

    .episode-list { display: flex; flex-direction: column; gap: 10px; }

    .episode-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      text-decoration: none;
      color: inherit;
    }
    .episode-card:hover { border-color: var(--accent); background: var(--surface2); }

    .ep-number {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid rgba(232, 184, 109, 0.3);
      border-radius: 6px;
      padding: 4px 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .ep-title {
      font-size: 15px;
      font-weight: 500;
      flex: 1;
    }
    .ep-cuts {
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
    }
    .ep-arrow {
      color: var(--text-dim);
      font-size: 18px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">W<span>ebtoon</span></div>
  </header>

  <main>
    <div class="breadcrumb" id="breadcrumb"></div>

    <!-- Series list -->
    <div id="series-view">
      <div class="section-title">
        작품 목록
        <small>총 <span id="series-count">0</span>개의 작품</small>
      </div>
      <div class="series-grid" id="series-grid"></div>
    </div>

    <!-- Episode list -->
    <div id="episode-view">
      <div class="series-header" id="series-header"></div>
      <div class="section-title">에피소드</div>
      <div class="episode-list" id="episode-list"></div>
    </div>
  </main>

  <script>
    let currentSeries = null;

    function showSeries() {
      currentSeries = null;
      document.getElementById('series-view').style.display = 'block';
      document.getElementById('episode-view').style.display = 'none';
      renderBreadcrumb();
    }

    function showEpisodes(series) {
      currentSeries = series;
      document.getElementById('series-view').style.display = 'none';
      document.getElementById('episode-view').style.display = 'block';
      renderBreadcrumb();
      renderEpisodeView(series);
    }

    function renderBreadcrumb() {
      const el = document.getElementById('breadcrumb');
      if (!currentSeries) { el.innerHTML = ''; return; }
      el.innerHTML = `
        <button onclick="showSeries()">작품 목록</button>
        <span class="sep">›</span>
        <span>${currentSeries.title}</span>
      `;
    }

    function renderSeriesGrid() {
      const grid = document.getElementById('series-grid');
      document.getElementById('series-count').textContent = CATALOG.series.length;

      grid.innerHTML = CATALOG.series.map(s => `
        <div class="series-card" onclick="showEpisodes(CATALOG.series.find(x => x.id === '${s.id}'))">
          <div class="en-title">${s.englishTitle}</div>
          <div class="kr-title">${s.title}</div>
          <div class="desc">${s.description}</div>
          <div class="meta">
            <div class="genre-tags">
              ${s.genre.map(g => `<span class="genre-tag">${g}</span>`).join('')}
            </div>
            <div class="ep-count">${s.episodes.length}화</div>
          </div>
        </div>
      `).join('');
    }

    function renderEpisodeView(series) {
      document.getElementById('series-header').innerHTML = `
        <div class="info">
          <div class="en">${series.englishTitle}</div>
          <div class="title">${series.title}</div>
          <div class="desc">${series.description}</div>
        </div>
      `;

      document.getElementById('episode-list').innerHTML = series.episodes.map((ep, i) => `
        <a class="episode-card" href="viewer.html?series=${series.id}&ep=${ep.id}">
          <span class="ep-number">EP ${ep.number || i + 1}</span>
          <span class="ep-title">${ep.title}</span>
          <span class="ep-cuts">${ep.cutCount}컷</span>
          <span class="ep-arrow">›</span>
        </a>
      `).join('');
    }

    renderSeriesGrid();
  </script>
</body>
</html>
